<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZANTA CITY — Open World</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="rotate"><div>↻</div><b>ROTATE YOUR PHONE</b><small>This game is designed for landscape mode</small></div>
<canvas id="game"></canvas>
<div id="hud">
  <div class="brand">ZANTA <span>CITY</span></div>
  <div class="stats"><span>💵 <b id="cash">250</b></span><span>🚗 <b id="vehicle">ON FOOT</b></span><span>🎯 <b id="mission">MISSION 01/60</b></span></div>
  <button id="mapBtn" class="map-preview" aria-label="Open map"><canvas id="mini" width="150" height="100"></canvas><small>TOUCH MAP</small></button>
  <div class="top-actions"><button id="shopBtn">SHOP</button><button id="missionsBtn">MISSIONS</button><button id="settingsBtn">⚙</button></div>
</div>
<div id="notice"></div>
<div id="controls">
  <div class="steer-options">
    <button data-mode="arrows" class="selected">‹ ›</button><button data-mode="wheel">◉</button><button data-mode="tilt">▣</button>
  </div>
  <div id="arrows" class="steer active"><button id="left">◀</button><button id="right">▶</button></div>
  <div id="wheel" class="steer"><div id="wheelPad">◉</div></div>
  <div id="tilt" class="steer"><span> Tilt phone to steer </span></div>
  <div class="right-controls"><button id="gas">▲<small>GO</small></button><button id="brake">▼<small>BRAKE</small></button><button id="action">E<small>ENTER / EXIT</small></button><button id="fire">✦<small>PULSE</small></button></div>
</div>
<div id="panel" class="hidden"><div class="panel-card"><button class="close" id="closePanel">✕</button><div id="panelContent"></div></div></div>
<div id="toast"></div>
<script src="game.js"></script>
</body></html>
