<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#090b12"><title>ZANTA MODS</title>
<style>
:root{--bg:#090b12;--panel:#121725;--panel2:#1a2233;--line:#293449;--red:#ff3657;--blue:#258cff;--txt:#f4f6fb;--muted:#98a5bc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,Arial;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;color:white;background:linear-gradient(110deg,var(--red),#b22c70);font-weight:700}input{width:100%;padding:14px;background:#0b101b;border:1px solid var(--line);border-radius:12px;color:white;outline:none;margin:6px 0 13px}input:focus{border-color:var(--blue)}label{font-size:13px;color:var(--muted)}
header{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#0d111c}.brand{font-weight:900;letter-spacing:2px;font-size:21px;color:var(--red)}.brand span{color:var(--blue)}
.wrap{max-width:1050px;margin:auto;padding:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.auth{max-width:440px;margin:7vh auto}.sub{color:var(--muted);line-height:1.5}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{background:var(--panel2);flex:1}.tabs .on{background:linear-gradient(110deg,var(--red),#b22c70)}
#app{display:grid;grid-template-columns:320px 1fr;gap:15px;height:calc(100vh - 105px);min-height:500px}.side,.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.sidehead,.chathead{padding:15px;border-bottom:1px solid var(--line)}.userline{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--blue));display:grid;place-items:center;font-weight:900}
#userList{overflow:auto}.person{display:flex;gap:10px;padding:13px 15px;border-bottom:1px solid #222b3a;cursor:pointer}.person:hover{background:var(--panel2)}.person small{display:block;color:var(--muted);margin-top:4px}
.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:78%;padding:10px 13px;border-radius:15px;background:#202a3d;align-self:flex-start;overflow-wrap:anywhere}.bubble.mine{background:#792b50;align-self:flex-end}.bubble small{display:block;color:#d5d8e4aa;font-size:10px;margin-top:5px;text-align:right}
.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.send input{margin:0}.send button{white-space:nowrap}.error{color:#ff8295;white-space:pre-wrap;font-size:13px}.notice{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:700px){.wrap{padding:10px}#app{display:block;height:calc(100dvh - 85px);min-height:0}.side{height:100%}.chat{height:100%;display:none}#app.chat-open .side{display:none}#app.chat-open .chat{display:flex}.auth{margin:4vh auto}}
</style></head><body>
<header><div class="brand">ZANTA <span>MODS</span></div><button id="logout" class="hidden">Log out</button></header>
<main class="wrap">
<section id="auth" class="card auth"><h2 id="authTitle">Create your account</h2><p class="sub">Register with a unique username and password.</p>
<div class="tabs"><button id="registerTab" class="on">Register</button><button id="loginTab">Login</button></div>
<div id="registerFields"><label>Username (3–24 characters)</label><input id="username" placeholder="zanta_user" maxlength="24" autocomplete="username"><label>Password (at least 8 characters)</label><input id="password" type="password" autocomplete="new-password"><button id="register" style="width:100%">Create account</button></div>
<div id="loginFields" class="hidden"><label>Username</label><input id="loginUsername" placeholder="Your username" autocomplete="username"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="login" style="width:100%">Login</button></div>
<p id="authError" class="error"></p><p class="notice">Use a unique password. This demo does not ask for your phone number or OTP.</p></section>
<section id="app" class="hidden"><aside class="side"><div class="sidehead"><div class="userline"><div class="avatar" id="myAvatar">Z</div><div><strong id="myName"></strong><div class="sub">Search users by username</div></div></div><input id="search" placeholder="Search username…"></div><div id="userList"></div></aside>
<section class="chat"><div class="chathead" style="display:flex;gap:10px;align-items:center"><button id="back" class="hidden" style="background:#273149">←</button><div><strong id="chatName">Choose a user</strong><div class="sub" id="chatSub">Private conversation</div></div></div><div class="messages" id="messages"><p class="sub">Search for a username to start chatting.</p></div><form class="send" id="sendForm"><input id="messageInput" placeholder="Write a message…" maxlength="4000" disabled><button id="sendButton" disabled>Send</button></form></section></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,query,where,getDocs,addDoc,orderBy,onSnapshot,serverTimestamp,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// Replace placeholders with your Firebase Web App config.
const firebaseConfig={apiKey:"PASTE_FIREBASE_API_KEY",authDomain:"PASTE_PROJECT_ID.firebaseapp.com",projectId:"PASTE_PROJECT_ID",storageBucket:"PASTE_PROJECT_ID.appspot.com",messagingSenderId:"PASTE_SENDER_ID",appId:"PASTE_APP_ID"};
const $=id=>document.getElementById(id);let auth,db,currentUser=null,currentProfile=null,activePeer=null,stopMessages=null;
function error(e){$("authError").textContent=e?.message||String(e)}
function configured(){return firebaseConfig.apiKey.startsWith("AIza")&&!firebaseConfig.projectId.startsWith("PASTE")}
if(configured()){const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{if(u){currentUser=u;const s=await getDoc(doc(db,"users",u.uid));if(s.exists()){currentProfile=s.data();showApp()}else{await signOut(auth);error("Account profile missing.")}}else showAuth()})}
else error("Setup required: add Firebase Web App config in this file.");
function emailFor(name){return name.toLowerCase()+"@users.zantamods.invalid"}
function showAuth(){$("auth").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden")}
function showApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("myName").textContent=currentProfile.username;$("myAvatar").textContent=currentProfile.username[0].toUpperCase()}
$("registerTab").onclick=()=>{ $("registerTab").classList.add("on");$("loginTab").classList.remove("on");$("registerFields").classList.remove("hidden");$("loginFields").classList.add("hidden");$("authTitle").textContent="Create your account";error("")};
$("loginTab").onclick=()=>{$("loginTab").classList.add("on");$("registerTab").classList.remove("on");$("loginFields").classList.remove("hidden");$("registerFields").classList.add("hidden");$("authTitle").textContent="Welcome back";error("")};
$("register").onclick=async()=>{try{if(!configured())throw Error("Firebase config is not set.");const name=$("username").value.trim(),pass=$("password").value;if(!/^[a-zA-Z0-9_]{3,24}$/.test(name))throw Error("Username must be 3–24 letters, numbers or underscore.");if(pass.length<8)throw Error("Password must be at least 8 characters.");const key=name.toLowerCase(),nameRef=doc(db,"usernames",key);const cred=await createUserWithEmailAndPassword(auth,emailFor(key),pass);try{await runTransaction(db,async tx=>{const existing=await tx.get(nameRef);if(existing.exists())throw Error("That username is already taken.");tx.set(nameRef,{uid:cred.user.uid});tx.set(doc(db,"users",cred.user.uid),{uid:cred.user.uid,username:name,usernameLower:key,createdAt:serverTimestamp()})})}catch(e){await cred.user.delete();throw e}}catch(e){error(e)}};
$("login").onclick=async()=>{try{if(!configured())throw Error("Firebase config is not set.");const name=$("loginUsername").value.trim().toLowerCase(),pass=$("loginPassword").value;if(!/^[a-zA-Z0-9_]{3,24}$/.test(name))throw Error("Enter a valid username.");await signInWithEmailAndPassword(auth,emailFor(name),pass)}catch(e){error(e)}};
$("logout").onclick=()=>signOut(auth);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("search").oninput=async()=>{const term=$("search").value.trim().toLowerCase();$("userList").innerHTML="";if(term.length<2)return;try{const q=query(collection(db,"users"),where("usernameLower",">=",term),where("usernameLower","<=",term+"\uf8ff"));const snaps=await getDocs(q);snaps.forEach(s=>{const u=s.data();if(u.uid===currentUser.uid)return;const el=document.createElement("div");el.className="person";el.innerHTML=`<div class="avatar">${escapeHtml(u.username[0].toUpperCase())}</div><div><strong>${escapeHtml(u.username)}</strong><small>Tap to message</small></div>`;el.onclick=()=>openChat(u);$("userList").appendChild(el)})}catch(e){error(e)}};
function threadId(a,b){return[a,b].sort().join("_")}
async function openChat(peer){activePeer=peer;$("chatName").textContent=peer.username;$("messageInput").disabled=false;$("sendButton").disabled=false;$("back").classList.remove("hidden");$("app").classList.add("chat-open");if(stopMessages)stopMessages();const id=threadId(currentUser.uid,peer.uid),ref=doc(db,"chats",id);await setDoc(ref,{participants:[currentUser.uid,peer.uid],updatedAt:serverTimestamp()},{merge:true});stopMessages=onSnapshot(query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc")),snap=>{const box=$("messages");box.innerHTML="";snap.forEach(s=>{const m=s.data(),b=document.createElement("div");b.className="bubble"+(m.senderId===currentUser.uid?" mine":"");b.textContent=m.text;const t=document.createElement("small");t.textContent=m.createdAt?.toDate?.().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})||"Sending…";b.appendChild(t);box.appendChild(b)});box.scrollTop=box.scrollHeight})}
$("back").onclick=()=>$("app").classList.remove("chat-open");
$("sendForm").onsubmit=async e=>{e.preventDefault();const text=$("messageInput").value.trim();if(!text||!activePeer)return;$("messageInput").value="";try{const id=threadId(currentUser.uid,activePeer.uid);await addDoc(collection(db,"chats",id,"messages"),{text,senderId:currentUser.uid,createdAt:serverTimestamp()});await setDoc(doc(db,"chats",id),{participants:[currentUser.uid,activePeer.uid],lastMessage:text,updatedAt:serverTimestamp()},{merge:true})}catch(e){error(e);$("messageInput").value=text}};
</script></body></html>
